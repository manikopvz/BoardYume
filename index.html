<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#182d2b" />
    <meta name="description" content="BoardYume — sandbox khu vườn 2.5D chạy hoàn toàn bằng DOM và raster assets." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./src/styles/main.css" />
    <title>BoardYume — Vườn Mộng</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      (() => {
        const runtimeKey = 'boardyume:runtime-version';
        const runtimeVersion = '4';
        if (!('serviceWorker' in navigator) || !navigator.serviceWorker.controller) return;
        try { if (localStorage.getItem(runtimeKey) === runtimeVersion) return; } catch { /* Continue with safe refresh. */ }
        navigator.serviceWorker.getRegistration('./')
          .then((registration) => registration?.unregister())
          .then((removed) => { if (removed) location.reload(); })
          .catch(() => {});
      })();
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
