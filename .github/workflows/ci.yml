name: BoardYume quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify assets, game systems and production build
        run: npm run check

      - name: Upload production build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: board-yume-dist
          path: dist
          if-no-files-found: error
          retention-days: 14
